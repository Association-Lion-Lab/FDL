services:
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: fdl_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  test:
    build:
      context: .
      target: dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: fdl_test
      PGDATABASE: postgres
    command: sh -c "npm ci && npm test"
